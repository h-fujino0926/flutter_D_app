name: flutter_d_app
description: "付箋風タスク管理ツール（チーム向けリアルタイム共有）"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.4

# ------------------------------------------------------------
# 依存パッケージはチーム全員の環境をそろえるため「完全固定」にしている。
# 更新するときは1人が `flutter pub outdated` で確認 → pubspec.yaml を書き換え →
# PRでまとめて上げること（各自で勝手に上げない）。
#
# 仮決定メモ：
# - window_manager / tray_manager は新しい版が Dart 3.13 以上を要求するため、
#   Flutter 3.44 系（Dart 3.12）で動く最新版に固定している。
# - freezed は riverpod_generator 4 系と analyzer のバージョンが両立するのが
#   4.0.0-dev.3（プレリリース版）しかないため、これに固定している。
# ------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # バックエンド
  supabase_flutter: 2.18.3

  # 状態管理・ルーティング・モデル
  flutter_riverpod: 3.5.0
  riverpod_annotation: 4.0.8
  go_router: 18.1.4
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0

  # デスクトップ（Windows）向け
  window_manager: 0.5.2
  tray_manager: 0.5.3
  local_notifier: 0.1.6
  screen_retriever: 0.2.2

  # その他
  table_calendar: 3.2.1
  app_links: 7.2.2
  shared_preferences: 2.5.6
  intl: 0.20.2
  cupertino_icons: 1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.15.1
  freezed: 4.0.0-dev.3
  json_serializable: 6.15.2
  riverpod_generator: 4.0.10
  fake_async: 1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.ico
